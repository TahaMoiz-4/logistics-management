# nginx config for the Nightingale web console.
#
# Replaces the Vite dev proxy (frontend/vite.config.ts) in production: the app
# calls relative /v1/... paths in both environments, so nothing in the frontend
# source changes between dev and deploy.

upstream backend {
    # "backend" resolves via Docker's embedded DNS to the backend service on
    # app-network. Port 8000 is the *container* port - the backend publishes no
    # host port, so this network is the only way in.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads/large payloads (e.g. a big synthetic instance POST).
    client_max_body_size 25m;

    # Don't advertise the exact nginx version in error pages / headers.
    server_tokens off;

    # ── Live solver stream (SSE) ─────────────────────────────────────────────
    # MUST come before the generic /v1/ block: nginx picks the longest matching
    # prefix, so this wins for the stream endpoint only.
    #
    # This block exists because nginx's defaults are actively wrong for SSE.
    # src/api/v1/route_plans.py returns an EventSourceResponse that trickles out
    # solver progress over a long-lived connection. With stock settings nginx
    # buffers the response and holds events until the buffer fills or the
    # response ends - so the live plan view would look frozen for the whole
    # solve, then dump every event at once. It reads as a hung UI, not a proxy
    # setting, which makes it a nasty thing to debug after the fact.
    location ~ ^/v1/route-plans/[^/]+/stream$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Forward each event the instant the app emits it.
        proxy_buffering off;
        proxy_cache off;

        # An ALNS solve runs up to max_runtime_sec (default 60s, tunable per
        # run). 1h ceiling so a long solve is never cut off mid-stream.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Clear the inherited "Connection: close" so the connection stays open.
        proxy_set_header Connection '';

        # Belt-and-braces: tells any *other* proxy in front (a GCP load
        # balancer later, say) not to buffer either.
        add_header X-Accel-Buffering no;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /v1/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # X-Forwarded-* are what uvicorn's --proxy-headers reads to recover the
        # real client IP; without them every request looks like it came from
        # this nginx container.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # ── OpenAPI docs (handy on a demo box; drop these two for a locked-down prod) ──
    location = /openapi.json { proxy_pass http://backend; proxy_set_header Host $host; }
    location /docs           { proxy_pass http://backend; proxy_set_header Host $host; }

    # ── Static assets ────────────────────────────────────────────────────────
    # Vite fingerprints these filenames (app.4f3a1c.js), so a new build produces
    # a new name and a long cache is safe - the browser can never serve a stale
    # bundle.
    location /assets/ {
        root /usr/share/nginx/html;
        # One header, not two: `expires 1y` emits its own Cache-Control, so
        # pairing it with add_header sends the directive twice. Set it once.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # react-router handles routing client-side, so a deep URL like /plans/123
    # has no matching file on disk. Without try_files, opening or refreshing
    # that URL would 404. Serving index.html lets the router take over.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # index.html itself must never be cached, or browsers keep loading the
        # old one - which points at bundle filenames that no longer exist.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
